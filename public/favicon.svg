<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Hard offset shadow -->
  <rect x="10" y="10" width="84" height="84" rx="28" fill="#1E293B" />
  
  <!-- Main sticker badge -->
  <rect x="6" y="6" width="84" height="84" rx="28" fill="#FBBF24" stroke="#1E293B" stroke-width="4" />
  
  <!-- Optical geometric prism -->
  <polygon points="48,22 76,70 20,70" fill="#8B5CF6" stroke="#1E293B" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Pop center light aperture -->
  <circle cx="48" cy="54" r="10" fill="#FFFDF5" stroke="#1E293B" stroke-width="3" />
  <circle cx="48" cy="54" r="4" fill="#34D399" />
  
  <!-- Playful confetti specks -->
  <circle cx="22" cy="26" r="4" fill="#F472B6" stroke="#1E293B" stroke-width="1.5" />
  <circle cx="76" cy="24" r="3" fill="#34D399" stroke="#1E293B" stroke-width="1.5" />
  <polygon points="76,46 80,54 72,54" fill="#F472B6" />
</svg>
