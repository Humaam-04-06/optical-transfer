<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#6b11ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#090d16" />
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="url(#beamGrad)" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Optical Aperture / Prism beam -->
  <polygon points="50,18 82,75 18,75" stroke="url(#beamGrad)" stroke-width="4" fill="none" filter="url(#glow)" />
  <circle cx="50" cy="56" r="10" fill="#00f2fe" filter="url(#glow)" opacity="0.9" />
  
  <!-- Optical pulse rings -->
  <circle cx="50" cy="56" r="22" stroke="#4facfe" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
  <circle cx="50" cy="56" r="32" stroke="#6b11ff" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.4" />
</svg>
